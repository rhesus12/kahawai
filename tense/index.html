

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verb Tense Challenge</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#17212b}
.wrap{max-width:760px;margin:auto;padding:18px}
header{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 3px 12px #00000012;margin-bottom:14px}
h1{margin:0 0 8px;font-size:28px}
.sub{color:#5d6975}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.score{font-size:22px;font-weight:700}
select{font-size:16px;padding:9px;border-radius:10px;border:1px solid #ccd5df;background:#fff}
.game{background:#fff;border-radius:18px;padding:22px;box-shadow:0 3px 12px #00000012;text-align:center}
.start-screen{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.ready{font-size:42px;font-weight:700;font-style:italic;color:#4b5560}
.level-choice{font-size:18px;font-weight:700;color:#4b5560}
.level-choice select{margin-left:8px}
.progress{font-weight:700;color:#687584;margin-bottom:14px}
.verbbox{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.verb{font-size:54px;font-weight:800;letter-spacing:1px;margin:4px}
.badge{display:inline-block;font-size:14px;font-weight:800;padding:5px 10px;border-radius:999px;color:#fff;margin-top:7px}
.a1{background:#35a853}.a2{background:#287bdc}.b1{background:#e58a00}.b2{background:#7a4fc2}
.prompt{font-size:18px;margin:8px 0 12px;color:#56616d}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto 18px}
button{border:0;border-radius:13px;padding:16px;font-size:20px;font-weight:800;cursor:pointer;touch-action:manipulation}
.tense{background:#e8f1ff;color:#1854a5;border:2px solid #bcd3f4}
.tense:hover{background:#dceaff}
.tense.correct{background:#d9f6df;border-color:#45ae5b;color:#247c36}
.tense.wrong{background:#ffe0e0;border-color:#db6262;color:#a22d2d}
input{width:min(560px,100%);font-size:24px;padding:13px;text-align:center;border:2px solid #cbd5df;border-radius:12px;text-transform:lowercase}
.check{background:#17212b;color:#fff;margin-top:10px;width:min(560px,100%)}
.next{background:#35a853;color:#fff;width:min(560px,100%);margin-top:10px}
.feedback{min-height:32px;font-size:18px;font-weight:700;margin:10px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.small{font-size:14px;padding:9px 13px;background:#edf0f3;color:#26333f}
.hidden{display:none}
#gameContent.hidden{display:none}
.end h2{font-size:30px}
.final{font-size:24px;font-weight:800;margin:15px}
.results-list{max-width:600px;margin:18px auto;text-align:left}
.result-item{border-top:1px solid #e1e6eb;padding:12px 8px}
.result-main{font-size:20px;font-weight:800;margin-bottom:5px}
.result-forms{font-size:16px;color:#53606c;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.result-ok{color:#25833a;font-weight:800}.result-no{color:#b33131;font-weight:800}
.dict-link{color:#1854a5;text-decoration:none}
.dict-link:hover{text-decoration:underline}
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:13px;font-weight:700}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px}
@media(max-width:500px){
 .wrap{padding:9px}.verb{font-size:43px}.game{padding:16px}
 h1{font-size:24px}.buttons{gap:8px}button{padding:14px 8px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="top">
  <div><h1>Verb Tense Challenge</h1><div class="sub">1 point when both the tense and the other tense are correct.</div></div>
  <div class="score">Score: <span id="score">0</span></div>
 </div>
</header>

<div class="game" id="game">
 <div id="startScreen" class="start-screen">
  <div class="ready">Ready?</div>
  <label class="level-choice">Select level:
   <select id="startLevelSelect">
    <option value="1" selected>Level 1 — A1</option>
    <option value="2">Level 2 — A2</option>
    <option value="3">Level 3 — B1–B2</option>
   </select>
  </label>
  <button class="next" id="startButton">START</button>
 </div>
 <div id="gameContent">
 <div class="top">
  <div class="progress" id="progress"></div>
  
 </div>

 <div class="verbbox">
  <div class="verb" id="verb"></div>
  <div class="badge" id="badge"></div>
 </div>

 <div class="prompt">Is this verb <b>past</b> or <b>present</b>?</div>
 <div class="buttons">
  <button class="tense" data-tense="past">PAST</button>
  <button class="tense" data-tense="present">PRESENT</button>
 </div>

 <div id="changeArea" class="hidden">
  <div class="prompt" id="changePrompt"></div>
  <input id="answer" autocomplete="off" autocapitalize="none">
  <button class="check" id="check">CHECK</button>
  <div class="feedback" id="feedback"></div>
  
 </div>

 <div class="controls">
  <button class="small" id="restart">Restart</button>
 </div>

 <div class="legend">
  <span><i class="dot a1"></i>A1</span>
  <span><i class="dot a2"></i>A2</span>
  <span><i class="dot b1"></i>B1</span>
  <span><i class="dot b2"></i>B2</span>
 </div>
 </div>
</div>

<div class="game end hidden" id="end">
 <h2>Game finished!</h2>
 <div class="final" id="final"></div>
 <div id="resultsList" class="results-list"></div>
 <button class="next" id="again">PLAY AGAIN</button>
</div>
</div>

<script>
const verbs=[
/* LEVEL 1 — A1: 60 verbs, 30 regular + 30 irregular */
["be","was/were","A1","irregular"],["have","had","A1","irregular"],["do","did","A1","irregular"],
["go","went","A1","irregular"],["come","came","A1","irregular"],["see","saw","A1","irregular"],
["eat","ate","A1","irregular"],["get","got","A1","irregular"],["take","took","A1","irregular"],
["give","gave","A1","irregular"],["say","said","A1","irregular"],["know","knew","A1","irregular"],
["find","found","A1","irregular"],["think","thought","A1","irregular"],["make","made","A1","irregular"],
["buy","bought","A1","irregular"],["bring","brought","A1","irregular"],["feel","felt","A1","irregular"],
["leave","left","A1","irregular"],["meet","met","A1","irregular"],["pay","paid","A1","irregular"],
["put","put","A1","irregular"],["read","read","A1","irregular"],["run","ran","A1","irregular"],
["send","sent","A1","irregular"],["sleep","slept","A1","irregular"],["spend","spent","A1","irregular"],
["stand","stood","A1","irregular"],["tell","told","A1","irregular"],["write","wrote","A1","irregular"],

["want","wanted","A1","regular"],["need","needed","A1","regular"],["work","worked","A1","regular"],
["play","played","A1","regular"],["watch","watched","A1","regular"],["like","liked","A1","regular"],
["love","loved","A1","regular"],["live","lived","A1","regular"],["look","looked","A1","regular"],
["walk","walked","A1","regular"],["talk","talked","A1","regular"],["call","called","A1","regular"],
["help","helped","A1","regular"],["open","opened","A1","regular"],["close","closed","A1","regular"],
["start","started","A1","regular"],["finish","finished","A1","regular"],["ask","asked","A1","regular"],
["answer","answered","A1","regular"],["use","used","A1","regular"],["wash","washed","A1","regular"],
["cook","cooked","A1","regular"],["clean","cleaned","A1","regular"],["study","studied","A1","regular"],
["visit","visited","A1","regular"],["listen","listened","A1","regular"],["learn","learned","A1","regular"],
["stay","stayed","A1","regular"],["wait","waited","A1","regular"],["rain","rained","A1","regular"],

/* LEVEL 2 — A2: 60 verbs, 30 regular + 30 irregular */
["build","built","A2","irregular"],["catch","caught","A2","irregular"],["choose","chose","A2","irregular"],
["drive","drove","A2","irregular"],["fall","fell","A2","irregular"],["fly","flew","A2","irregular"],
["forget","forgot","A2","irregular"],["grow","grew","A2","irregular"],["hear","heard","A2","irregular"],
["hold","held","A2","irregular"],["keep","kept","A2","irregular"],["learn","learnt","A2","irregular"],
["lend","lent","A2","irregular"],["let","let","A2","irregular"],["ride","rode","A2","irregular"],
["ring","rang","A2","irregular"],["sell","sold","A2","irregular"],["sit","sat","A2","irregular"],
["speak","spoke","A2","irregular"],["swim","swam","A2","irregular"],["teach","taught","A2","irregular"],
["understand","understood","A2","irregular"],["win","won","A2","irregular"],["wear","wore","A2","irregular"],
["become","became","A2","irregular"],["begin","began","A2","irregular"],["break","broke","A2","irregular"],
["cut","cut","A2","irregular"],["hurt","hurt","A2","irregular"],["stick","stuck","A2","irregular"],

["arrive","arrived","A2","regular"],["borrow","borrowed","A2","regular"],["change","changed","A2","regular"],
["decide","decided","A2","regular"],["describe","described","A2","regular"],["discover","discovered","A2","regular"],
["enjoy","enjoyed","A2","regular"],["explain","explained","A2","regular"],["happen","happened","A2","regular"],
["imagine","imagined","A2","regular"],["improve","improved","A2","regular"],["invite","invited","A2","regular"],
["join","joined","A2","regular"],["move","moved","A2","regular"],["order","ordered","A2","regular"],
["plan","planned","A2","regular"],["practise","practised","A2","regular"],["prepare","prepared","A2","regular"],
["receive","received","A2","regular"],["remember","remembered","A2","regular"],["return","returned","A2","regular"],
["save","saved","A2","regular"],["share","shared","A2","regular"],["show","showed","A2","regular"],
["smile","smiled","A2","regular"],["travel","travelled","A2","regular"],["try","tried","A2","regular"],
["carry","carried","A2","regular"],["follow","followed","A2","regular"],["hurry","hurried","A2","regular"],

/* LEVEL 3 — B1/B2: 60 verbs, 30 regular + 30 irregular */
["arise","arose","B2","irregular"],["bear","bore","B2","irregular"],["deal","dealt","B2","irregular"],
["draw","drew","B1","irregular"],["feed","fed","B1","irregular"],["fight","fought","B1","irregular"],
["hang","hung","B1","irregular"],["hide","hid","B1","irregular"],["lead","led","B1","irregular"],
["lie","lay","B1","irregular"],["mean","meant","B1","irregular"],["overcome","overcame","B2","irregular"],
["seek","sought","B2","irregular"],["shake","shook","B1","irregular"],["shoot","shot","B1","irregular"],
["shut","shut","B1","irregular"],["steal","stole","B1","irregular"],["strike","struck","B2","irregular"],
["swear","swore","B2","irregular"],["tear","tore","B1","irregular"],["throw","threw","B1","irregular"],
["undertake","undertook","B2","irregular"],["withdraw","withdrew","B2","irregular"],["withstand","withstood","B2","irregular"],
["undergo","underwent","B2","irregular"],["bind","bound","B2","irregular"],["breed","bred","B2","irregular"],
["cling","clung","B2","irregular"],["flee","fled","B2","irregular"],["forbid","forbade","B2","irregular"],

["achieve","achieved","B1","regular"],["acquire","acquired","B2","regular"],["analyse","analysed","B2","regular"],
["assume","assumed","B2","regular"],["attempt","attempted","B1","regular"],["contribute","contributed","B2","regular"],
["create","created","B1","regular"],["demonstrate","demonstrated","B2","regular"],["develop","developed","B1","regular"],
["establish","established","B2","regular"],["estimate","estimated","B2","regular"],["evaluate","evaluated","B2","regular"],
["expand","expanded","B1","regular"],["experience","experienced","B1","regular"],["identify","identified","B1","regular"],
["implement","implemented","B2","regular"],["increase","increased","B1","regular"],["maintain","maintained","B2","regular"],
["manage","managed","B1","regular"],["occur","occurred","B2","regular"],["participate","participated","B1","regular"],
["reduce","reduced","B1","regular"],["require","required","B2","regular"],["respond","responded","B1","regular"],
["reveal","revealed","B2","regular"],["select","selected","B1","regular"],["suggest","suggested","B1","regular"],
["support","supported","B1","regular"],["vary","varied","B2","regular"],["verify","verified","B2","regular"]
];

let deck=[],index=0,score=0,current=null,chosen=null,results=[];

const $=id=>document.getElementById(id);
const norm=s=>s.trim().toLowerCase().replace(/[.]/g,"");
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function start(){
 score=0;index=0;chosen=null;results=[];
 $("score").textContent=0;$("game").classList.remove("hidden");$("end").classList.add("hidden");
 $("startScreen").classList.remove("hidden");$("gameContent").classList.add("hidden");
 const gameLevel=+$("startLevelSelect").value;
 const allowed = gameLevel===1 ? ["A1"] :
                 gameLevel===2 ? ["A2"] :
                 ["B1","B2"];
 deck=shuffle(verbs.filter(v=>allowed.includes(v[2]))).slice(0,5);
}
function show(){
 current=deck[index];
 $("progress").textContent=`Verb ${index+1} of ${deck.length}`;
 const isPast=Math.random()<.5;
 current=[current[0],current[1],current[2],isPast];
 $("verb").textContent=isPast?current[1].toUpperCase():current[0].toUpperCase();
 const level=current[2];
 $("badge").textContent=level;
 $("badge").className="badge "+level.toLowerCase();
 $("changeArea").classList.add("hidden");
 $("answer").value="";$("feedback").textContent="";
 $("answer").classList.remove("hidden");$("answer").disabled=false;
 $("check").classList.remove("hidden");$("check").disabled=false;
 
 document.querySelectorAll(".tense").forEach(b=>{b.className="tense";b.disabled=false});
 chosen=null;
}
document.querySelectorAll(".tense").forEach(btn=>btn.onclick=()=>{
 if(chosen)return;
 chosen=btn.dataset.tense;
 const correct=(current[3] && chosen==="past")||(!current[3]&&chosen==="present");
 btn.classList.add(correct?"correct":"wrong");
 document.querySelectorAll(".tense").forEach(b=>b.disabled=true);
 const result={
   base:current[0],past:current[1],level:current[2],shown:(current[3]?current[1]:current[0]),
   tenseCorrect:correct,formCorrect:null,studentTense:chosen
 };
 results.push(result);
 if(correct){
   const original=current[3]?current[1]:current[0];
   $("changePrompt").innerHTML=`Now write the <b>${current[3]?"present":"past"}</b> tense of <b>${original.toUpperCase()}</b>.`;
   $("changeArea").classList.remove("hidden");
   $("answer").focus();
 } else {
   $("feedback").textContent="Sorry, wrong.";
   $("feedback").style.color="#b33131";
   setTimeout(()=>advance(),700);
 }
});
$("check").onclick=()=>{
 const expected=current[3]?current[0]:current[1];
 const ans=norm($("answer").value);
 let ok=false;
 if(expected==="was/were") ok=["am","is","are","be"].includes(ans);
 else if(expected==="read") ok=ans==="read";
 else ok=ans===expected;
 results[results.length-1].formCorrect=ok;
 if(ok){
  if(results[results.length-1].tenseCorrect){
   score++;$("score").textContent=score;
   $("feedback").textContent="✓ Correct! +1 point";
   $("feedback").style.color="#25833a";
  }else{
   $("feedback").textContent="✓ Other tense correct.";
   $("feedback").style.color="#25833a";
  }
 }else{
  $("feedback").textContent=`✗ The answer is ${expected}.`;
  $("feedback").style.color="#b33131";
 }
 $("check").disabled=true;$("answer").disabled=true;
 setTimeout(()=>advance(),700);
};
function advance(){
 index++;
 if(index>=deck.length) finish();
 else show();
}
function finish(){
 $("game").classList.add("hidden");$("end").classList.remove("hidden");
 const max=deck.length;
 $("final").textContent=`${score} / ${max}`;
 $("resultsList").innerHTML=results.map(r=>{
   const tenseMark=r.tenseCorrect?'✓':'✗';
   const formMark=r.formCorrect===null?'—':(r.formCorrect?'✓':'✗');
   return `<div class="result-item">
     <div class="result-main"><span class="${r.tenseCorrect?'result-ok':'result-no'}">${r.tenseCorrect?'✓ Correct':'✗ Wrong'}</span> — Tense: <b>${r.studentTense.toUpperCase()}</b></div>
     <div class="result-forms">
       <span>Present: <a class="dict-link" href="https://dictionary.cambridge.org/dictionary/english/${encodeURIComponent(r.base)}" target="_blank" rel="noopener"><b>${r.base}</b> ↗</a></span>
       <span>Past: <b>${r.past}</b></span>
     </div>
   </div>`;
 }).join("");
}
$("restart").onclick=start;$("again").onclick=start;
$("startButton").onclick=()=>{
 $("startScreen").classList.add("hidden");
 $("gameContent").classList.remove("hidden");
 show();
};
start();
</script>
</body>
</html>
